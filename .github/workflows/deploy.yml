name: Deploy to GitHub Pages

# Vite needs a build step and GitHub Pages will not run one for you, so the
# site is built here and the dist/ artifact is what gets published. This also
# means only dist/ is served — the rest of the repo (agents/, docs/,
# resume.md) stays out of the public site.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let an in-flight deploy finish rather than cancelling it, so a half-applied
# deploy never reaches production.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Runs `tsc --noEmit && vite build`, so a type error fails the deploy
      # and main stays green.
      - name: Build
        run: npm run build

      # SPA deep-link fallback. GitHub Pages has no rewrite rules: a direct
      # visit or refresh on /resume or /apps has no file behind it and would
      # 404. Pages does serve 404.html for unknown paths, so shipping a copy
      # of index.html under that name hands control to the React router.
      # Removing this step silently breaks every URL except /.
      - name: Add 404.html SPA fallback
        run: cp dist/index.html dist/404.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
